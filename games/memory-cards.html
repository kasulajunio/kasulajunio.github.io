<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Cards | MIGABIO Arcade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;padding:20px}
h1{font-size:1.6rem;margin-bottom:4px;background:linear-gradient(135deg,#ff3e67,#4ECDC4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#hud{display:flex;gap:20px;margin:8px 0 16px;font-size:.9rem;color:#888}
#hud span{color:#00d9ff}
#hud .hi{color:#ff3e67}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;width:100%}
.card{aspect-ratio:3/4;background:#111118;border:2px solid #1a1a2e;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2.2rem;transition:all .3s;position:relative;-webkit-tap-highlight-color:transparent}
.card::before{content:'?';color:#333;font-size:2rem;font-weight:700}
.card.flipped{border-color:#4ECDC4;background:#0f1a1a;box-shadow:0 0 15px rgba(78,205,196,.2)}
.card.flipped::before{content:attr(data-emoji)}
.card.matched{border-color:#ff3e67;background:#1a0f14;box-shadow:0 0 15px rgba(255,62,103,.2);pointer-events:none}
.card.matched::before{content:attr(data-emoji)}
#msg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,15,.95);z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#msg h2{font-size:2rem;color:#4ECDC4;text-shadow:0 0 20px rgba(78,205,196,.5)}
#msg p{color:#aaa;font-size:1.1rem}
#msg button{padding:12px 32px;border:none;border-radius:8px;background:linear-gradient(135deg,#4ECDC4,#45B7D1);color:#0a0a0f;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:1px;transition:.2s}
#msg button:hover{transform:scale(1.05)}
.brand{margin-top:auto;padding:20px;font-size:11px;color:#222;letter-spacing:2px}
</style>
</head>
<body>
<h1>Memory Cards</h1>
<div id="hud"><div>Moves: <span id="mv">0</span></div><div>Pairs: <span class="hi" id="pr">0</span>/8</div><div>Time: <span id="tm">0s</span></div></div>
<div class="grid" id="grid"></div>
<div id="msg"><h2 id="mt">Parabens!</h2><p id="mp"></p><button onclick="startGame()">JOGAR DE NOVO</button></div>
<div class="brand">MIGABIO STUDIO</div>
<script>
const emojis=['&#x1F525;','&#x1F680;','&#x1F3AE;','&#x2B50;','&#x1F916;','&#x1F30D;','&#x26A1;','&#x1F48E;'];
let cards,flipped,matched,moves,pairs,timer,startTime,locked;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){const deck=shuffle([...emojis,...emojis]);cards=deck;flipped=[];matched=new Set();moves=0;pairs=0;locked=false;
document.getElementById('mv').textContent=0;document.getElementById('pr').textContent='0';document.getElementById('tm').textContent='0s';
document.getElementById('msg').style.display='none';clearInterval(timer);startTime=Date.now();
timer=setInterval(()=>{document.getElementById('tm').textContent=Math.floor((Date.now()-startTime)/1000)+'s'},1000);
const grid=document.getElementById('grid');grid.innerHTML='';
deck.forEach((e,i)=>{const card=document.createElement('div');card.className='card';card.dataset.emoji=e;card.dataset.idx=i;
card.addEventListener('click',()=>flipCard(card,i));grid.appendChild(card)})}
function flipCard(card,idx){if(locked||flipped.length>=2||flipped.includes(idx)||matched.has(idx))return;
card.classList.add('flipped');flipped.push(idx);
if(flipped.length===2){moves++;document.getElementById('mv').textContent=moves;locked=true;
const[a,b]=flipped;if(cards[a]===cards[b]){matched.add(a);matched.add(b);
document.querySelectorAll('.card')[a].classList.add('matched');document.querySelectorAll('.card')[b].classList.add('matched');
pairs++;document.getElementById('pr').textContent=pairs;flipped=[];locked=false;
if(pairs===8){clearInterval(timer);const t=Math.floor((Date.now()-startTime)/1000);
document.getElementById('mt').textContent='Parabens!';document.getElementById('mp').textContent=moves+' jogadas em '+t+'s';
document.getElementById('msg').style.display='flex'}}
else{setTimeout(()=>{document.querySelectorAll('.card')[a].classList.remove('flipped');
document.querySelectorAll('.card')[b].classList.remove('flipped');flipped=[];locked=false},800)}}}
startGame();
</script>
</body>
</html>
