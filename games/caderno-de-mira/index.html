<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ead5"><title>Caderno de Mira • Fabio7X</title><style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#eee3cc;color:#253a42;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button{font:inherit;font-weight:800;border:2px solid #253a42;border-radius:12px;padding:12px 18px;background:#fff9eb;color:#253a42;box-shadow:3px 4px 0 #253a42;cursor:pointer;touch-action:manipulation}button:active{transform:translate(2px,2px);box-shadow:1px 2px 0 #253a42}button.primary{background:#edb952}button.small{padding:8px 12px;font-size:13px}.hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:start;gap:8px;pointer-events:none}.badge{background:#fff9ebe8;border:2px solid #526267;border-radius:10px;padding:8px 12px;box-shadow:2px 3px 0 #0002}.badge strong{display:block;font-size:22px;line-height:1.1}.badge span{font-size:11px;text-transform:uppercase;letter-spacing:1px}.hud button{pointer-events:auto}.bottom{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;gap:12px}.bottom button{pointer-events:auto}.fire{width:90px;height:90px;border-radius:50%;background:#c65647;color:white;box-shadow:3px 5px 0 #253a42;font-size:16px}.tools{display:flex;flex-direction:column;gap:10px}.hint{position:fixed;bottom:130px;left:15%;right:15%;text-align:center;font-size:12px;pointer-events:none;background:#fff9ebcc;padding:5px;border-radius:6px}.overlay{position:fixed;inset:0;background:#27394260;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}.sheet{width:min(510px,100%);max-height:94dvh;overflow:auto;background:repeating-linear-gradient(#fff8e8 0 27px,#adc6cc55 28px 29px);padding:26px;border:2px solid #394b50;border-radius:5px 19px 8px 6px;box-shadow:8px 10px 0 #23363c44;transform:rotate(-1deg)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#a34137}h1{font-size:clamp(32px,7vw,47px);line-height:1;letter-spacing:-2px;margin:14px 0;color:#264a60}h2{font-size:28px;margin:10px 0}p{line-height:1.55;font-size:14px}.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stats b{display:block;font-size:24px}.stats div{padding:10px 4px;text-align:center;background:#fff9eaaa;border:1px dashed #526267;border-radius:8px}.stats small{font-size:11px}.muted{font-size:12px;color:#586970}.tag{display:inline-block;border:1px dashed #53696f;padding:4px 9px;transform:rotate(2deg);font-size:12px}.hidden{display:none!important}#toast{position:fixed;top:105px;left:10%;right:10%;text-align:center;font-weight:850;font-size:20px;color:#264a60;pointer-events:none;text-shadow:0 1px #fff}#progress{position:fixed;top:88px;left:16px;right:16px;height:5px;background:#253a4220;border-radius:5px;overflow:hidden}#bar{height:100%;background:#408b77;width:0;transition:width .2s}@media(max-height:480px){.sheet{padding:16px}h1{font-size:32px;margin:6px 0}.sheet p{margin:7px 0}.fire{width:74px;height:74px}.hint{bottom:100px}.stats{margin:9px 0}}
</style></head><body><canvas id="game" aria-label="Galeria de tiro ao alvo em primeira pessoa. Arraste para mirar e toque no botão Atirar."></canvas><div class="hud"><div class="badge"><span id="stageLabel">Fase 1 / 6</span><strong id="score">0 pts</strong></div><div class="badge"><span id="goal">Alvos 0 / 6</span><strong id="clock">45s</strong></div><button class="small" id="pause" aria-label="Pausar jogo">Ⅱ</button></div><div id="progress"><div id="bar"></div></div><div id="toast" aria-live="polite"></div><div class="hint" id="hint">Arraste a tela para mirar • toque rápido também dispara</div><div class="bottom"><div class="tools"><div class="badge"><span>Dardos</span><strong id="ammo">8 / 8</strong></div><button class="small" id="reload">Recarregar ↻</button></div><button class="fire" id="fire">ATIRAR</button></div><div class="overlay" id="overlay"><section class="sheet" id="sheet"></section></div><script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const $=id=>document.getElementById(id);const stages=[{name:"Primeira página",goal:6,time:45,speed:0,count:3},{name:"Rabiscos em movimento",goal:9,time:45,speed:.65,count:4},{name:"Vai e vem",goal:12,time:50,speed:1,count:5},{name:"Não acerte a borracha",goal:14,time:50,speed:1.2,count:5},{name:"Folhas ao vento",goal:17,time:55,speed:1.5,count:6},{name:"Prova final",goal:20,time:60,speed:1.8,count:6}];
let W=0,H=0,D=1,F=1,last=0,elapsed=0,state="menu",level=0,score=0,hits=0,shots=0,combo=0,ammo=8,time=45,reloading=0,shotCD=0,recoil=0,flash=0,toastTime=0,best=0,muted=false,audio=null;let yaw=0,pitch=0,targets=[],sparks=[],marks=[],keys={};
try{best=Number(localStorage.getItem("caderno-mira-best"))||0}catch(e){}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);F=Math.max(W,H)*.85}addEventListener("resize",resize);resize();
function sound(freq,duration=.08,type="triangle"){if(muted)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.45),audio.currentTime+duration);g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function project(x,y,z){let dx=x*Math.cos(yaw)-z*Math.sin(yaw),dz=x*Math.sin(yaw)+z*Math.cos(yaw);let dy=y*Math.cos(pitch)-dz*Math.sin(pitch);let zz=y*Math.sin(pitch)+dz*Math.cos(pitch);if(zz<.3)return null;return{x:W/2+dx*F/zz,y:H*.47-dy*F/zz,s:F/zz,z:zz}}
function spawn(i){let st=stages[level],z=10+Math.random()*6;let x=(i%3-1)*3.3+(Math.random()-.5)*1.6;let y=.2+Math.floor(i/3)*2.4+(Math.random()-.5);return{x,y,z,bx:x,by:y,r:level<2?1.02:.86,phase:Math.random()*6.28,age:0,wait:Math.random()*.6,bad:level>=3&&i===st.count-1,color:["#cf6757","#5b9c86","#668fab","#b881a2"][i%4]}}
function start(n,reset=false){level=n;if(reset){score=0;shots=0;hits=0}state="play";time=stages[level].time;targets=Array.from({length:stages[level].count},(_,i)=>spawn(i));combo=0;ammo=8;reloading=0;shotCD=0;yaw=0;pitch=0;marks=[];sparks=[];window.stageHits=0;$("overlay").classList.add("hidden");notify(stages[level].name);hud()}
function hud(){$("stageLabel").textContent=`Fase ${level+1} / 6`;$("score").textContent=`${score} pts`;$("clock").textContent=`${Math.ceil(time)}s`;$("goal").textContent=`Alvos ${window.stageHits||0} / ${stages[level].goal}`;$("ammo").textContent=reloading>0?"Carregando…":`${ammo} / 8`;$("bar").style.width=`${Math.min(100,(window.stageHits||0)/stages[level].goal*100)}%`}
function notify(text){$("toast").textContent=text;toastTime=1.5}function panel(html){$("sheet").innerHTML=html;$("overlay").classList.remove("hidden")}
function menu(){state="menu";panel(`<div class="eyebrow">FABIO7X • PROTÓTIPO JOGÁVEL 1.0</div><h1>CADERNO<br>DE MIRA</h1><span class="tag">Tiro ao alvo em primeira pessoa</span><p>Um estande de papel, um lançador de dardos e seis fases para testar sua precisão. Acerte o centro, emende acertos e vença o relógio.</p><p><b>No celular:</b> arraste para olhar e use <b>ATIRAR</b>. Um toque rápido no cenário mira e dispara.<br><b>No computador:</b> arraste com o mouse; espaço dispara, R recarrega e Esc pausa.</p><p class="muted">A partir da fase 4, não atire nas borrachas com X. Dardos ilimitados, 8 por recarga. Melhor pontuação: ${best}.</p><div class="row"><button class="primary" id="start">Começar a jogar →</button><button id="sound">Som: ${muted?"desligado":"ligado"}</button></div>`);$("start").onclick=()=>{sound(550);start(0,true)};$("sound").onclick=()=>{muted=!muted;menu()}}
function finish(win){state="result";let newBest=score>best;if(newBest){best=score;try{localStorage.setItem("caderno-mira-best",String(best))}catch(e){}}let final=win&&level===stages.length-1;panel(`<div class="eyebrow">${final?"CADERNO COMPLETO":win?"PÁGINA CONCLUÍDA":"O TEMPO ACABOU"}</div><h2>${final?"Mira de respeito!":win?"Boa! Próxima página?":"Mais uma tentativa?"}</h2><p>${win?stages[level].name+" concluída.":`Você acertou ${window.stageHits} de ${stages[level].goal} alvos. A recarga é ilimitada: use sem medo.`}</p><div class="stats"><div><b>${score}</b><small>PONTOS</small></div><div><b>${shots?Math.round(hits/shots*100):0}%</b><small>PRECISÃO</small></div><div><b>${best}</b><small>RECORDE</small></div></div><div class="row"><button class="primary" id="next">${win&&!final?"Próxima fase →":"Jogar de novo ↻"}</button><button id="home">Menu</button></div>`);$("next").onclick=()=>win&&!final?start(level+1):start(0,true);$("home").onclick=menu}
function pause(){if(state==="play"){state="pause";panel(`<div class="eyebrow">INTERVALO</div><h2>Caderno fechado por um instante.</h2><p>Seu tempo está parado.</p><div class="row"><button class="primary" id="resume">Continuar →</button><button id="home">Voltar ao menu</button></div>`);$("resume").onclick=pause;$("home").onclick=menu}else if(state==="pause"){state="play";$("overlay").classList.add("hidden")}}
function reload(){if(state!=="play"||reloading>0||ammo===8)return;reloading=1.05;notify("Recarregando…");sound(160,.2);hud()}
function shoot(){if(state!=="play"||shotCD>0||reloading>0)return;if(ammo<=0){reload();return}shotCD=.18;ammo--;shots++;recoil=1;flash=.07;sound(230,.07,"square");let aim={x:W/2,y:H*.47},hit=null,bestZ=Infinity;for(let t of targets){if(t.wait>0)continue;let p=project(t.x,t.y,t.z);if(!p)continue;let dist=Math.hypot(aim.x-p.x,aim.y-p.y)/(t.r*p.s);if(dist<=1&&p.z<bestZ){hit={t,p,dist};bestZ=p.z}}if(hit){let{t,p,dist}=hit;if(t.bad){score=Math.max(0,score-100);time=Math.max(0,time-3);combo=0;notify("Borracha! −100 pts e −3s");sound(90,.2)}else{hits++;window.stageHits++;combo++;let points=dist<.3?100:dist<.65?50:20;let mult=Math.min(5,1+Math.floor((combo-1)/3));score+=points*mult;notify(`${dist<.3?"NO CENTRO!":"ACERTO!"} +${points*mult}${mult>1?" • combo ×"+mult:""}`);sound(dist<.3?900:650,.12);if(navigator.vibrate)navigator.vibrate(15)}for(let i=0;i<13;i++)sparks.push({x:p.x,y:p.y,vx:(Math.random()-.5)*250,vy:(Math.random()-.5)*230,life:.6,c:t.color});Object.assign(t,spawn(targets.indexOf(t)),{wait:.6});if(window.stageHits>=stages[level].goal){score+=Math.ceil(time)*10;hud();finish(true)}}else{combo=0;marks.push({yaw,pitch,life:2});sound(130,.04);notify("Fora! Ajuste a mira")}if(ammo===0&&state==="play")reload();hud()}
function line(x1,y1,x2,y2,c="#657e8970",w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function worldLine(a,b,c,w=1){let p=project(...a),q=project(...b);if(p&&q)line(p.x,p.y,q.x,q.y,c,w)}
function drawTarget(t){if(t.wait>0)return;let p=project(t.x,t.y,t.z);if(!p)return;let r=t.r*p.s;if(p.x+r<0||p.x-r>W||p.y+r<0||p.y-r>H)return;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(elapsed+t.phase)*.07);ctx.fillStyle="#283e4325";ctx.beginPath();ctx.ellipse(5,9,r*1.07,r*1.07,0,0,Math.PI*2);ctx.fill();if(t.bad){ctx.fillStyle="#e4a8aa";ctx.strokeStyle="#4c5354";ctx.lineWidth=2;ctx.fillRect(-r,-r*.7,r*2,r*1.4);ctx.strokeRect(-r,-r*.7,r*2,r*1.4);ctx.fillStyle="#456c8d";ctx.fillRect(-r,-r*.7,r*.65,r*1.4);line(-r*.3,-r*.4,r*.6,r*.4,"#3a4143",3);line(r*.6,-r*.4,-r*.3,r*.4,"#3a4143",3)}else{let colors=["#fff9e7",t.color,"#fff3d1",t.color];for(let i=0;i<4;i++){let rr=r*(1-i*.24);ctx.fillStyle=colors[i];ctx.strokeStyle="#344b57";ctx.lineWidth=1.5;ctx.beginPath();for(let k=0;k<=64;k++){let a=k/64*Math.PI*2;let jitter=1+Math.sin(k*3+t.phase)*.014;let x=Math.cos(a)*rr*jitter,y=Math.sin(a)*rr*jitter;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke()}ctx.fillStyle="#253a42";ctx.font=`800 ${Math.max(11,r*.32)}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("100",0,0);line(-r*1.12,0,-r*.85,0,"#344b57");line(r*.85,0,r*1.12,0,"#344b57");ctx.fillStyle="#9aabac";ctx.fillRect(-r*.12,-r*1.12,r*.24,r*.28)}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#f8f0dd");bg.addColorStop(1,"#e6d6b6");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let horizon=H*.54+pitch*H*.6;ctx.fillStyle="#c7b28d25";ctx.fillRect(0,horizon,W,H-horizon);for(let y=-6;y<8;y+=.7)worldLine([-18,y,20],[18,y,20],"#77a0b545");worldLine([-9,-6,20],[-9,8,20],"#cd6b6260",2);for(let z=3;z<=24;z+=2)worldLine([-18,-3,z],[18,-3,z],"#526b7540");for(let x=-18;x<=18;x+=3)worldLine([x,-3,3],[x,-3,25],"#526b7530");let label=project(0,5.2,20);if(label){ctx.save();ctx.translate(label.x,label.y);ctx.rotate(-.025);ctx.textAlign="center";ctx.fillStyle="#315469";ctx.font=`900 ${Math.max(17,label.s*.65)}px system-ui`;ctx.fillText("ACERTE O ALVO!",0,0);ctx.font=`600 ${Math.max(10,label.s*.25)}px system-ui`;ctx.fillStyle="#8a6b51";ctx.fillText("F A B I O 7 X   •   E S T A N D E   D E   P A P E L",0,label.s*.52);ctx.restore()}targets.slice().sort((a,b)=>b.z-a.z).forEach(drawTarget);for(let s of sparks){ctx.fillStyle=s.c;ctx.globalAlpha=Math.max(0,s.life/.6);ctx.fillRect(s.x,s.y,5,7)}ctx.globalAlpha=1;let cx=W/2,cy=H*.47;ctx.strokeStyle=flash>0?"#bf4c3e":"#263f49";ctx.lineWidth=2;let gap=8+recoil*8;line(cx-gap-11,cy,cx-gap,cy,ctx.strokeStyle,2);line(cx+gap,cy,cx+gap+11,cy,ctx.strokeStyle,2);line(cx,cy-gap-11,cx,cy-gap,ctx.strokeStyle,2);line(cx,cy+gap,cx,cy+gap+11,ctx.strokeStyle,2);ctx.beginPath();ctx.arc(cx,cy,2,0,Math.PI*2);ctx.fillStyle="#b04c3c";ctx.fill();let gunScale=Math.min(W/420,H/470,1.35);ctx.save();ctx.translate(W*.55,H+recoil*23+(reloading>0?35:0));ctx.scale(gunScale,gunScale);ctx.rotate(-.13+recoil*.06);ctx.fillStyle="#b98d67";ctx.strokeStyle="#3a4b50";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-22,20);ctx.lineTo(-30,-70);ctx.quadraticCurveTo(-65,-140,-32,-158);ctx.lineTo(36,-135);ctx.lineTo(80,20);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#d6b675";ctx.beginPath();ctx.moveTo(-36,-115);ctx.lineTo(-24,-242);ctx.lineTo(12,-280);ctx.lineTo(45,-242);ctx.lineTo(57,-115);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#557d8e";ctx.fillRect(-29,-199,78,35);ctx.strokeRect(-29,-199,78,35);ctx.fillStyle="#344c56";ctx.fillRect(0,-273,23,62);ctx.fillStyle="#e9d9af";ctx.fillRect(-14,-148,47,12);ctx.restore();if(flash>0){ctx.fillStyle="#fff8ca";ctx.beginPath();ctx.arc(W*.55,H-285*gunScale,14,0,Math.PI*2);ctx.fill()}}
let drag=null;canvas.addEventListener("pointerdown",e=>{if(state!=="play")return;canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:0,at:performance.now()}});canvas.addEventListener("pointermove",e=>{if(!drag||drag.id!==e.pointerId||state!=="play")return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);yaw=Math.max(-.7,Math.min(.7,yaw-dx/F*.9));pitch=Math.max(-.38,Math.min(.38,pitch+dy/F*.9));drag.x=e.clientX;drag.y=e.clientY});canvas.addEventListener("pointerup",e=>{if(!drag||drag.id!==e.pointerId)return;if(drag.moved<12&&performance.now()-drag.at<350&&state==="play"){yaw=Math.max(-.7,Math.min(.7,yaw+Math.atan((e.clientX-W/2)/F)));pitch=Math.max(-.38,Math.min(.38,pitch-Math.atan((e.clientY-H*.47)/F)));shoot()}drag=null});canvas.addEventListener("pointercancel",()=>drag=null);$("fire").addEventListener("pointerdown",e=>{e.preventDefault();shoot()});$("reload").onclick=reload;$("pause").onclick=pause;addEventListener("keydown",e=>{if(["Space","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==="Space")shoot();if(e.code==="KeyR")reload();if(e.code==="Escape")pause()});addEventListener("keyup",e=>keys[e.code]=false);addEventListener("blur",()=>{keys={};drag=null;if(state==="play")pause()});document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play")pause()});
function frame(now){let dt=Math.min((now-last)/1000,.05)||0;last=now;elapsed+=dt;if(state==="play"){time=Math.max(0,time-dt);shotCD=Math.max(0,shotCD-dt);if(reloading>0){reloading-=dt;if(reloading<=0){reloading=0;ammo=8;sound(380,.06)}}let st=stages[level];for(let t of targets){t.age+=dt;t.wait=Math.max(0,t.wait-dt);t.x=t.bx+Math.sin(t.age*st.speed+t.phase)*st.speed*1.1;t.y=t.by+Math.sin(t.age*st.speed*1.3+t.phase)*st.speed*.45}if(keys.ArrowLeft||keys.KeyA)yaw-=dt*.7;if(keys.ArrowRight||keys.KeyD)yaw+=dt*.7;if(keys.ArrowUp||keys.KeyW)pitch+=dt*.5;if(keys.ArrowDown||keys.KeyS)pitch-=dt*.5;yaw=Math.max(-.7,Math.min(.7,yaw));pitch=Math.max(-.38,Math.min(.38,pitch));if(time<=0)finish(false);hud()}recoil=Math.max(0,recoil-dt*6);flash=Math.max(0,flash-dt);toastTime=Math.max(0,toastTime-dt);$("toast").style.opacity=toastTime>0?1:0;for(let s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=200*dt;s.life-=dt}sparks=sparks.filter(s=>s.life>0);draw();requestAnimationFrame(frame)}
window.cadernoDebug=()=>({state,level,score,hits,shots,ammo,time,stageHits:window.stageHits||0,targets:targets.map(t=>({...t,screen:project(t.x,t.y,t.z)}))});menu();requestAnimationFrame(frame);
</script></body></html>
