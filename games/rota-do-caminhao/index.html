<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rota do Caminhão</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;background:#18352b;color:white;font:16px system-ui;overflow:hidden}main{max-width:500px;margin:auto;height:100dvh;position:relative}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;background:#10251cdd;padding:12px;border-radius:12px}button{border:0;border-radius:14px;background:#efbd49;color:#182c23;font:bold 20px system-ui;padding:18px;min-height:60px}.keys{position:absolute;bottom:20px;left:14px;right:14px;display:flex;justify-content:space-between;gap:15px}.keys button{flex:1}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px;gap:20px;background:#122b24f2}.panel[hidden]{display:none}h1{font-size:38px;line-height:1.1;margin:0}p{line-height:1.5;color:#d2dfd6;margin:0}.tag{color:#efbd49;font-size:12px;letter-spacing:3px}</style><main><canvas id="c"></canvas><div class="hud"><b id="meters">0 / 2000 m</b><b id="health">Carga: 100%</b><span id="pause" role="button" tabindex="0" aria-label="Pausar">Ⅱ</span></div><div class="keys"><button id="left" aria-label="Esquerda">◀</button><button id="brake">FREIO</button><button id="right" aria-label="Direita">▶</button></div><section id="panel" class="panel"><div class="tag">CAMINHÃO AMARELO · ESTRADAS DO BRASIL</div><h1 id="title">Rota do Caminhão</h1><p id="text">Leve a carga por 2 km. Desvie dos carros e cones. Pegue caixas para recuperar a carga.</p><button id="go">PEGAR A ESTRADA</button><p>Toque nas setas para mudar de faixa.<br>Segure o freio para reduzir.</p></section></main><script>(()=>{const $=s=>document.getElementById(s),c=$("c"),g=c.getContext("2d");let w,h,x,lane=1,mode="menu",d=0,hp=100,items=[],spawn=1,t0=0,off=0,inv=0,brake=false,boxes=0;const mid=n=>w*(.25+n*.25);function resize(){w=c.clientWidth;h=c.clientHeight;let p=Math.min(devicePixelRatio||1,2);c.width=w*p;c.height=h*p;g.setTransform(p,0,0,p,0,0);x=mid(lane)}addEventListener("resize",resize);resize();const r=(x,y,a,b,col)=>{g.fillStyle=col;g.fillRect(x,y,a,b)};function truck(x,y,col,small){let a=w*(small?.12:.14),b=small?64:96;r(x-a/2-4,y-b/2+8,a+8,b-12,"#111c19");r(x-a/2,y-b/2,a,b*.3,col);r(x-a*.38,y-b/2+7,a*.76,11,"#8cb4bc");r(x-a/2,y-b*.17,a,b*.66,"#aab2a7");for(let i=0;i<5;i++)r(x-a/2+3,y-b*.12+i*10,a-6,2,"#6c7e71");r(x-a/2,y+b/2-6,7,4,"#e56c42");r(x+a/2-7,y+b/2-6,7,4,"#e56c42")}function draw(){r(0,0,w,h,"#627849");for(let i=0;i<10;i++){let y=(i*110+off*.6)%(h+100);for(let xx of [w*.03,w*.97]){g.fillStyle="#365639";g.beginPath();g.arc(xx,y,23,0,7);g.fill()}}r(w*.11,0,w*.78,h,"#b5aa8e");r(w*.125,0,w*.75,h,"#454d48");for(let j=0;j<2;j++)for(let i=-1;i<h/70+1;i++)r(w*(.375+j*.25),(i*70+off)%(h+70)-70,3,35,"#d6d5b6");for(let o of items){let xx=mid(o.lane);if(o.type==="car")truck(xx,o.y,"#588e9b",true);else if(o.type==="box"){r(xx-15,o.y-15,30,30,"#b48950");r(xx-3,o.y-15,6,30,"#f0d19c")}else{g.fillStyle="#f29040";g.beginPath();g.moveTo(xx,o.y-23);g.lineTo(xx-18,o.y+20);g.lineTo(xx+18,o.y+20);g.fill();r(xx-10,o.y,20,6,"#fff5d6");r(xx-22,o.y+20,44,5,"#24372c")}}if(inv<=0||Math.floor(inv*12)%2===0)truck(x,h*.7,"#eeb633",false)}function hud(){$("meters").textContent=Math.floor(d)+" / 2000 m";$("health").textContent="Carga: "+hp+"%"}function panel(title,text,label){$("title").textContent=title;$("text").textContent=text;$("go").textContent=label;$("panel").hidden=false}function start(){lane=1;x=mid(1);d=0;hp=100;items=[];spawn=1.5;inv=0;boxes=0;mode="play";brake=false;$("panel").hidden=true;hud()}function move(n){if(mode==="play")lane=Math.max(0,Math.min(2,lane+n))}function pause(){if(mode!=="play")return;mode="pause";brake=false;panel("Parada rápida","Sua viagem está pausada.","CONTINUAR")}$("left").onpointerdown=()=>move(-1);$("right").onpointerdown=()=>move(1);$("brake").onpointerdown=e=>{brake=true;e.target.setPointerCapture(e.pointerId)};for(let ev of ["pointerup","pointercancel","lostpointercapture"])$("brake").addEventListener(ev,()=>brake=false);$("pause").onclick=pause;$("go").onclick=()=>{if(mode==="pause"){mode="play";$("panel").hidden=true}else start()};addEventListener("blur",pause);document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft"&&!e.repeat)move(-1);if(e.key==="ArrowRight"&&!e.repeat)move(1);if(e.key===" ")brake=true;if(e.key==="Escape")pause()});addEventListener("keyup",e=>{if(e.key===" ")brake=false});function tick(t){let dt=Math.min((t-t0)/1000||0,.05);t0=t;if(mode==="play"){let speed=brake?110:250+d*.03;off=(off+speed*dt)%(h+70);d+=speed*dt*.15;x+=(mid(lane)-x)*Math.min(1,dt*15);inv=Math.max(0,inv-dt);spawn-=dt;if(spawn<=0){items.push({lane:Math.floor(Math.random()*3),y:-100,type:Math.random()<.25?"box":Math.random()<.5?"car":"cone"});spawn=1+Math.random()*.5}for(let o of items){o.y+=speed*dt;if(!o.hit&&Math.abs(o.y-h*.7)<(o.type==="car"?70:58)&&Math.abs(mid(o.lane)-x)<w*.1){o.hit=true;if(o.type==="box"){hp=Math.min(100,hp+12);boxes++}else if(inv===0){hp=Math.max(0,hp-(o.type==="car"?35:20));inv=1.2}}}items=items.filter(o=>!o.hit&&o.y<h+100);if(hp<=0||d>=2000){mode="end";brake=false;let win=hp>0;if(win)d=2000;panel(win?"Entrega concluída!":"A carga ficou pelo caminho",win?"Você terminou com "+hp+"% da carga e coletou "+boxes+" caixas.":"Você percorreu "+Math.floor(d)+" m. Use o freio para ganhar tempo nos desvios.","JOGAR DE NOVO")}hud()}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);window.gameTest={state:()=>({mode,lane,d,hp,boxes}),move,pause}})();</script></html>
