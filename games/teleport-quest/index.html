<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#eee4cc"><title>Teleport Quest • Ilhas de Papel</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;background:#eee4cc;color:#30424b;font:14px system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}button{font:inherit;font-weight:800;padding:12px;border:2px solid #3a515b;border-radius:12px;background:#fff6e4;color:#30424b;box-shadow:3px 4px #34465140;touch-action:none;cursor:pointer}button:disabled{opacity:.45}.main{background:#edc06e}.hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}.hud>div{background:#fff8e9ef;border:1px solid #536a73;border-radius:8px;padding:8px;font-size:11px;font-weight:750}.hud button{pointer-events:auto;padding:5px 13px}.bar{height:6px;width:130px;background:#34465120;margin:4px 0;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#a17bb5}#hp{background:#cb7e69}.controls{position:fixed;inset:0;pointer-events:none}.controls button{position:absolute;pointer-events:auto;border-radius:50%;padding:0;font-size:10px;line-height:1.5}#stick{position:absolute;bottom:63px;left:16px;width:100px;height:100px;border:2px dashed #486573;border-radius:50%;background:#fff8e690;pointer-events:auto;touch-action:none}#knob{position:absolute;left:26px;top:26px;width:44px;height:44px;border:2px solid #486573;border-radius:50%;background:#8fafbecc;pointer-events:none}#stick span{position:absolute;top:-22px;width:100%;text-align:center;font-size:10px;font-weight:900}#jump{right:12px;bottom:57px;width:65px;height:65px;background:#b0ca9e}#tele{right:86px;bottom:47px;width:80px;height:80px;background:#c3a4d5}#fire{right:24px;bottom:137px;width:51px;height:51px;background:#e6b37e}#dash{right:88px;bottom:139px;width:49px;height:49px;background:#9ebfcf}#ult{right:151px;bottom:135px;width:42px;height:42px;background:#e5cf8c}#quest{position:fixed;bottom:8px;left:10px;right:10px;text-align:center;background:#fff8e8e8;border:1px dashed #607780;border-radius:6px;padding:6px;font-size:10px;pointer-events:none}#toast{position:fixed;top:95px;left:15px;right:15px;text-align:center;font-weight:850;font-size:14px;color:#694d77;text-shadow:0 1px #fff;pointer-events:none}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#30424b65;backdrop-filter:blur(4px);padding:18px}.paper{width:min(550px,100%);max-height:92dvh;overflow:auto;padding:24px;border:2px solid #405761;border-radius:5px 18px 6px 5px;background:repeating-linear-gradient(#fff7e5 0 27px,#b0c6cd88 28px 29px);box-shadow:8px 10px #30424b44;transform:rotate(-.6deg)}h1{font-size:clamp(33px,9vw,52px);line-height:1;letter-spacing:-2px;margin:15px 0;color:#3b5e6c}h2{color:#3b5e6c;margin:12px 0}p{line-height:1.55;font-size:13px}.label{font-size:10px;letter-spacing:2px;color:#9a6148;font-weight:900}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.tile{text-align:left;border-style:dashed;background:#fff9edbb}.tile b{display:block}.tile small{font-size:10px;font-weight:500}.muted{font-size:11px;color:#60747c}.hidden{display:none!important}@media(max-height:480px){.paper{padding:16px}h1{font-size:32px;margin:7px 0}p{margin:7px 0}#stick{bottom:42px;width:88px;height:88px}#knob{left:20px;top:20px}#tele{bottom:38px}#jump{bottom:45px}#fire,#dash{bottom:122px}#ult{bottom:118px}#toast{top:76px}}</style><body><canvas id="c" aria-label="Teleport Quest, plataforma de papel com teleporte"></canvas><div class="hud"><div><span id="status">RAPOSA · LV 1</span><div class="bar"><i id="hp"></i></div><span id="energyText">Energia 100/100</span><div class="bar"><i id="energy"></i></div>
