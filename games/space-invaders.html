<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders | MIGABIO Arcade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden;user-select:none}
#hud{display:flex;gap:24px;margin-bottom:8px;font-size:14px;letter-spacing:1px}
#hud span{color:#00d9ff}#hud .hi{color:#ff3e67}
canvas{border:2px solid #1a1a2e;border-radius:8px;box-shadow:0 0 40px rgba(0,217,255,.12);touch-action:none}
#msg{position:absolute;display:flex;flex-direction:column;align-items:center;gap:12px;background:rgba(10,10,15,.94);padding:32px 48px;border-radius:16px;border:1px solid #4ECDC4;box-shadow:0 0 60px rgba(78,205,196,.2)}
#msg h2{font-size:28px;color:#4ECDC4;text-shadow:0 0 20px rgba(78,205,196,.5)}
#msg p{font-size:14px;color:#aaa;text-align:center}
#msg button{padding:12px 32px;border:none;border-radius:8px;background:linear-gradient(135deg,#4ECDC4,#45B7D1);color:#0a0a0f;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:.2s}
#msg button:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(78,205,196,.4)}
.brand{position:fixed;bottom:10px;font-size:11px;color:#222;letter-spacing:2px}
.ctrl{display:none;gap:16px;margin-top:10px}
.ctrl button{width:60px;height:60px;border-radius:50%;border:2px solid #1a1a2e;background:rgba(255,255,255,.05);color:#fff;font-size:24px;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media(pointer:coarse){.ctrl{display:flex}}
</style>
</head>
<body>
<div id="hud"><div>Score: <span id="sc">0</span></div><div>Lives: <span class="hi" id="lv">3</span></div><div>Wave: <span id="wv">1</span></div></div>
<canvas id="c"></canvas>
<div id="msg"><h2 id="mt">Space Invaders</h2><p id="mp">Setas ou toque para mover<br>Espaco ou toque para atirar</p><button onclick="init()">JOGAR</button></div>
<div class="ctrl"><button ontouchstart="tl=1" ontouchend="tl=0">&#9664;</button><button ontouchstart="shoot()" >&#9650;</button><button ontouchstart="tr=1" ontouchend="tr=0">&#9654;</button></div>
<div class="brand">MIGABIO STUDIO</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=Math.min(innerWidth-20,480);H=Math.min(innerHeight-120,600);C.width=W;C.height=H}
window.addEventListener('resize',resize);resize();
let player,bullets,enemies,eBullets,score,lives,wave,running,tl=0,tr=0,lastShot=0;
const msgBox=document.getElementById('msg');
function init(){player={x:W/2,y:H-30,w:30,h:16};bullets=[];eBullets=[];score=0;lives=3;wave=1;
document.getElementById('sc').textContent=0;document.getElementById('lv').textContent=3;document.getElementById('wv').textContent=1;
spawnWave();running=true;msgBox.style.display='none';requestAnimationFrame(loop)}
function spawnWave(){enemies=[];const rows=3+Math.min(wave,4),cols=Math.min(6+wave,10),gx=W/(cols+1),gy=32;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)enemies.push({x:gx*(c+1),y:50+r*gy,w:22,h:14,hp:1,dir:1})}
function shoot(){if(Date.now()-lastShot<250)return;bullets.push({x:player.x,y:player.y-10,vy:-7});lastShot=Date.now()}
const keys={};document.addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' ')shoot()});
document.addEventListener('keyup',e=>keys[e.key]=0);
C.addEventListener('touchstart',e=>{const t=e.touches[0],r=C.getBoundingClientRect();
const tx=t.clientX-r.left;if(tx<W/3)tl=1;else if(tx>W*2/3)tr=1;else shoot()});
C.addEventListener('touchend',()=>{tl=0;tr=0});
function loop(){if(!running)return;update();draw();requestAnimationFrame(loop)}
function update(){const spd=4;if(keys.ArrowLeft||keys.a||tl)player.x-=spd;if(keys.ArrowRight||keys.d||tr)player.x+=spd;
player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));
bullets=bullets.filter(b=>{b.y+=b.vy;return b.y>-10});
let edgeHit=false;enemies.forEach(e=>{e.x+=e.dir*(0.5+wave*0.2);if(e.x<15||e.x>W-15)edgeHit=true});
if(edgeHit){enemies.forEach(e=>{e.dir*=-1;e.y+=12})}
if(Math.random()<0.01*enemies.length&&enemies.length>0){const e=enemies[Math.floor(Math.random()*enemies.length)];
eBullets.push({x:e.x,y:e.y+10,vy:3+wave*0.3})}
eBullets=eBullets.filter(b=>{b.y+=b.vy;return b.y<H+10});
bullets.forEach((b,bi)=>{enemies.forEach((e,ei)=>{if(Math.abs(b.x-e.x)<e.w/2+3&&Math.abs(b.y-e.y)<e.h/2+3){
enemies.splice(ei,1);bullets.splice(bi,1);score+=10*wave;document.getElementById('sc').textContent=score}})});
eBullets.forEach((b,bi)=>{if(Math.abs(b.x-player.x)<player.w/2+3&&Math.abs(b.y-player.y)<player.h/2+3){
eBullets.splice(bi,1);lives--;document.getElementById('lv').textContent=lives;if(lives<=0)gameOver()}});
enemies.forEach(e=>{if(e.y>H-50)gameOver()});
if(enemies.length===0){wave++;document.getElementById('wv').textContent=wave;spawnWave()}}
function gameOver(){running=false;document.getElementById('mt').textContent='Game Over';
document.getElementById('mp').textContent='Score: '+score+' | Wave: '+wave;msgBox.style.display='flex'}
function draw(){X.fillStyle='#0a0a0f';X.fillRect(0,0,W,H);
for(let i=0;i<30;i++){X.fillStyle='rgba(255,255,255,'+(0.1+Math.random()*0.3)+')';X.fillRect(Math.random()*W,Math.random()*H,1,1)}
X.save();X.shadowColor='#4ECDC4';X.shadowBlur=10;X.fillStyle='#4ECDC4';
X.beginPath();X.moveTo(player.x,player.y-player.h/2);X.lineTo(player.x-player.w/2,player.y+player.h/2);
X.lineTo(player.x+player.w/2,player.y+player.h/2);X.closePath();X.fill();X.restore();
bullets.forEach(b=>{X.fillStyle='#00d9ff';X.shadowColor='#00d9ff';X.shadowBlur=8;X.fillRect(b.x-1,b.y,3,8);X.shadowBlur=0});
eBullets.forEach(b=>{X.fillStyle='#ff3e67';X.shadowColor='#ff3e67';X.shadowBlur=6;X.fillRect(b.x-1,b.y,3,6);X.shadowBlur=0});
enemies.forEach(e=>{X.fillStyle='#ff3e67';X.shadowColor='#ff3e67';X.shadowBlur=6;
X.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);X.fillStyle='#ff6b6b';X.fillRect(e.x-4,e.y-2,3,3);X.fillRect(e.x+2,e.y-2,3,3);X.shadowBlur=0})}
draw();
</script>
</body>
</html>
