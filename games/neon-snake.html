<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonSnake | MIGABIO Arcade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden;user-select:none}
#hud{display:flex;gap:24px;margin-bottom:12px;font-size:14px;letter-spacing:1px}
#hud span{color:#00d9ff}
#hud .hi{color:#ff3e67}
canvas{border:2px solid #1a1a2e;border-radius:8px;box-shadow:0 0 40px rgba(0,217,255,.15);touch-action:none}
#msg{position:absolute;display:flex;flex-direction:column;align-items:center;gap:12px;background:rgba(10,10,15,.92);padding:32px 48px;border-radius:16px;border:1px solid #ff3e67;box-shadow:0 0 60px rgba(255,62,103,.2)}
#msg h2{font-size:28px;color:#ff3e67;text-shadow:0 0 20px rgba(255,62,103,.5)}
#msg p{font-size:16px;color:#aaa}
#msg button{padding:12px 32px;border:none;border-radius:8px;background:linear-gradient(135deg,#ff3e67,#ff6b6b);color:#fff;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:.2s}
#msg button:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(255,62,103,.4)}
.brand{position:fixed;bottom:12px;font-size:11px;color:#333;letter-spacing:2px}
</style>
</head>
<body>
<div id="hud"><div>Score: <span id="score">0</span></div><div>Best: <span id="best" class="hi">0</span></div></div>
<canvas id="c"></canvas>
<div id="msg"><h2 id="mt">NeonSnake</h2><p id="mp">Toque ou use setas para jogar</p><button onclick="startGame()">JOGAR</button></div>
<div class="brand">MIGABIO STUDIO</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const msgBox=document.getElementById('msg'),mt=document.getElementById('mt'),mp=document.getElementById('mp');
let W,H,G=20,cols,rows,snake,dir,food,score,best=+(localStorage.getItem('ns_best')||0),speed,loop,alive;
bestEl.textContent=best;
function resize(){const s=Math.min(innerWidth-24,innerHeight-100,500);W=H=Math.floor(s/G)*G;cols=W/G;rows=H/G;C.width=W;C.height=H}
window.addEventListener('resize',resize);resize();
function rand(n){return Math.floor(Math.random()*n)}
function cell(){return{x:rand(cols),y:rand(rows)}}
function eq(a,b){return a.x===b.x&&a.y===b.y}
function onSnake(p){return snake.some(s=>eq(s,p))}
function placeFood(){do{food=cell()}while(onSnake(food))}
function startGame(){score=0;scoreEl.textContent=0;snake=[{x:Math.floor(cols/2),y:Math.floor(rows/2)}];dir={x:1,y:0};speed=120;alive=true;placeFood();msgBox.style.display='none';clearInterval(loop);loop=setInterval(tick,speed)}
function tick(){if(!alive)return;const h={x:(snake[0].x+dir.x+cols)%cols,y:(snake[0].y+dir.y+rows)%rows};if(snake.some(s=>eq(s,h))){die();return}snake.unshift(h);if(eq(h,food)){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('ns_best',best)}placeFood();if(speed>50){speed-=2;clearInterval(loop);loop=setInterval(tick,speed)}}else{snake.pop()}draw()}
function die(){alive=false;clearInterval(loop);mt.textContent='Game Over';mp.textContent='Score: '+score+(score>=best?' NOVO RECORDE!':'');msgBox.style.display='flex'}
function draw(){X.fillStyle='#0a0a0f';X.fillRect(0,0,W,H);for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){X.fillStyle='#111118';X.fillRect(i*G+1,j*G+1,G-2,G-2)}X.fillStyle='#ff3e67';X.shadowColor='#ff3e67';X.shadowBlur=15;X.beginPath();X.arc(food.x*G+G/2,food.y*G+G/2,G/2-2,0,Math.PI*2);X.fill();X.shadowBlur=0;snake.forEach((s,i)=>{const p=i/snake.length;X.fillStyle=`hsl(${180-p*60},100%,${60-p*20}%)`;X.shadowColor=i===0?'#00d9ff':'transparent';X.shadowBlur=i===0?12:0;X.fillRect(s.x*G+1,s.y*G+1,G-2,G-2)});X.shadowBlur=0}
document.addEventListener('keydown',e=>{if(!alive)return;const k=e.key;if((k==='ArrowUp'||k==='w')&&dir.y!==1)dir={x:0,y:-1};if((k==='ArrowDown'||k==='s')&&dir.y!==-1)dir={x:0,y:1};if((k==='ArrowLeft'||k==='a')&&dir.x!==1)dir={x:-1,y:0};if((k==='ArrowRight'||k==='d')&&dir.x!==-1)dir={x:1,y:0}});
let tx=0,ty=0;C.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY});
C.addEventListener('touchend',e=>{if(!alive)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x!==- 1)dir={x:1,y:0};else if(dx<0&&dir.x!==1)dir={x:-1,y:0}}else{if(dy>0&&dir.y!==-1)dir={x:0,y:1};else if(dy<0&&dir.y!==1)dir={x:0,y:-1}}});
draw();
</script>
</body>
</html>
