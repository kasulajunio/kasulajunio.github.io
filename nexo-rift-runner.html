<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA: Rift Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#090f13;color:#edf4f6;font-family:system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(100vw,960px);height:min(100vh,620px);position:relative}canvas{width:100%;height:100%;display:block;background:#111c22;touch-action:none}.hud{position:absolute;inset:0;padding:16px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 1px 3px #000}b{color:#7bd2d6;letter-spacing:.1em}.help{position:absolute;bottom:14px;left:8px;right:8px;text-align:center;color:#bdcbd0;font-size:12px}.panel{position:absolute;inset:0;display:grid;place-items:center;background:#071014c9}.card{max-width:390px;margin:16px;padding:24px;text-align:center;background:#142229;border:1px solid #50636b;border-radius:14px}.card button{border:0;border-radius:8px;background:#7bd2d6;color:#071014;padding:12px 20px;font-weight:800;font-size:15px}</style><main><canvas id="c"></canvas><div class="hud"><div><b>NEXA // RIFT ARENA</b><div id="life">INTEGRIDADE 100%</div></div><div id="score">0 PTS</div></div><div class="help">WASD/setas: mover · toque ou mouse: mirar/disparar · espaço: evasão</div><div id="menu" class="panel"><div class="card"><h1>NEXA: Rift Arena</h1><p>Protótipo de teste. Sobreviva à arena e elimine as unidades hostis.</p><button id="go">INICIAR TESTE</button></div></div></main><script>const c=document.querySelector("#c"),g=c.getContext("2d"),life=document.querySelector("#life"),sc=document.querySelector("#score"),menu=document.querySelector("#menu"),go=document.querySelector("#go");let w,h,on=0,last=0,score=0,keys={},aim={x:0,y:0,down:0},p={},bots=[],bul=[],spawn=0;function rs(){let d=Math.min(devicePixelRatio,2);w=c.clientWidth;h=c.clientHeight;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}addEventListener("resize",rs);rs();function u(x,y){let d=Math.hypot(x,y)||1;return{x:x/d,y:y/d}}function start(){p={x:w/2,y:h/2,hp:100,cd:0,dash:0};bots=[];bul=[];score=0;spawn=.3;on=1;menu.hidden=1}go.onclick=start;function add(){let s=Math.floor(Math.random()*4),q=s==0?{x:Math.random()*w,y:-20}:s==1?{x:w+20,y:Math.random()*h}:s==2?{x:Math.random()*w,y:h+20}:{x:-20,y:Math.random()*h};bots.push({...q,r:13,hp:40,fire:Math.random()})}function tick(dt){if(!on)return;p.cd-=dt;p.dash-=dt;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),z=u(dx,dy),v=p.dash>0?650:220;p.x=Math.max(14,Math.min(w-14,p.x+z.x*v*dt));p.y=Math.max(14,Math.min(h-14,p.y+z.y*v*dt));if(aim.down&&p.cd<=0){let q=u(aim.x-p.x,aim.y-p.y);bul.push({x:p.x,y:p.y,vx:q.x*590,vy:q.y*590,t:1,team:0});p.cd=.15}spawn-=dt;if(spawn<=0){add();spawn=.85}for(let e of bots){let q=u(p.x-e.x,p.y-e.y),d=Math.hypot(p.x-e.x,p.y-e.y);if(d>150){e.x+=q.x*55*dt;e.y+=q.y*55*dt}e.fire-=dt;if(d<310&&e.fire<=0){bul.push({x:e.x,y:e.y,vx:q.x*225,vy:q.y*225,t:1.5,team:1});e.fire=1.2}}for(let b of bul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;if(!b.team)for(let e of bots)if(Math.hypot(e.x-b.x,e.y-b.y)<18){e.hp-=20;b.t=0;if(e.hp<=0)score+=100}else if(b.team&&p.dash<=0&&Math.hypot(p.x-b.x,p.y-b.y)<18){p.hp-=10;b.t=0}}bul=bul.filter(b=>b.t>0);bots=bots.filter(e=>e.hp>0);if(p.hp<=0){on=0;menu.hidden=0;menu.querySelector("h1").textContent="SINAL PERDIDO";menu.querySelector("p").textContent="Pontuação: "+score+". Reentre na arena.";go.textContent="TENTAR DE NOVO"}life.textContent="INTEGRIDADE "+Math.max(0,p.hp)+"%";sc.textContent=score+" PTS"}function draw(){g.fillStyle="#111c22";g.fillRect(0,0,w,h);g.strokeStyle="#20343b";for(let i=0;i<w;i+=40){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke()}for(let i=0;i<h;i+=40){g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}for(let b of bul){g.fillStyle=b.team?"#ed7870":"#e6c46c";g.beginPath();g.arc(b.x,b.y,3,0,7);g.fill()}for(let e of bots){g.fillStyle="#b85e5c";g.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2)}if(p.x){let a=Math.atan2(aim.y-p.y,aim.x-p.x);g.save();g.translate(p.x,p.y);g.rotate(a);g.fillStyle=p.dash>0?"#e6c46c":"#7bd2d6";g.beginPath();g.moveTo(19,0);g.lineTo(-11,-11);g.lineTo(-5,0);g.lineTo(-11,11);g.fill();g.restore()}}function loop(t){let d=Math.min(.033,(t-last)/1000||0);last=t;tick(d);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function pt(e){let r=c.getBoundingClientRect();aim.x=(e.clientX-r.left)*w/r.width;aim.y=(e.clientY-r.top)*h/r.height}c.onpointermove=pt;c.onpointerdown=e=>{pt(e);aim.down=1};c.onpointerup=()=>aim.down=0;addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1;if(e.code=="Space"&&p.dash<=0){p.dash=.24;e.preventDefault()}});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);addEventListener("blur",()=>{keys={};aim.down=0});</script></html>
